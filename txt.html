<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>云阅读 - EPUB/TXT阅读器</title>
    <style>
        :root {
            --bg: #f5e6c8;
            --text: #3b2a1a;
            --text-secondary: #8a765c;
            --accent: #b4542c;
            --accent-light: #d4733f;
            --toolbar-bg: rgba(255, 248, 232, 0.92);
            --panel-bg: #fff8ec;
            --border: #e4d4b8;
            --shadow: rgba(60, 40, 20, 0.12);
            --progress-bar: #b4542c;
            --font-size: 18px;
            --line-height: 1.85;
            --font-family: 'Georgia', 'SimSun', 'Noto Serif SC', serif;
            --transition-speed: 0.3s;
            /* 纸张纹理叠加（极弱） */
            --paper-texture:
                radial-gradient(rgba(120, 80, 40, 0.05) 1px, transparent 1px) 0 0 / 3px 3px,
                radial-gradient(rgba(120, 80, 40, 0.04) 1px, transparent 1px) 1px 1px / 3px 3px;
        }

        [data-theme="white"] {
            --bg: #fdfdfd;
            --text: #2a2a2a;
            --text-secondary: #7a7a7a;
            --accent: #c8402e;
            --accent-light: #e7593f;
            --toolbar-bg: rgba(255, 255, 255, 0.94);
            --panel-bg: #fafafa;
            --border: #e8e8e8;
            --shadow: rgba(0, 0, 0, 0.08);
            --progress-bar: #c8402e;
            --paper-texture:
                radial-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px) 0 0 / 3px 3px;
        }

        [data-theme="night"] {
            /* 优化：柔和深蓝灰基底 + 蓝灰强调色（代替原纯黑+刺眼红） */
            --bg: #181b24;
            --text: #c6ccd8;
            --text-secondary: #6f7788;
            --accent: #6b8aff;
            --accent-light: #93abff;
            --toolbar-bg: rgba(30, 34, 46, 0.92);
            --panel-bg: #222737;
            --border: #2e3346;
            --shadow: rgba(0, 0, 0, 0.5);
            --progress-bar: #6b8aff;
            --paper-texture:
                /* 星点/纸纹：极微弱的小颗粒，避免纯平黑 */
                radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 3px 3px,
                radial-gradient(rgba(107, 138, 255, 0.02) 1.4px, transparent 1.4px) 2px 1px / 5px 5px;
        }

        [data-theme="green"] {
            --bg: #cce8cf;
            --text: #273a2b;
            --text-secondary: #5a7560;
            --accent: #357a3b;
            --accent-light: #53a15a;
            --toolbar-bg: rgba(210, 232, 212, 0.92);
            --panel-bg: #e1f1e3;
            --border: #a8c8ac;
            --shadow: rgba(40, 70, 50, 0.1);
            --progress-bar: #357a3b;
            --paper-texture:
                radial-gradient(rgba(40, 80, 50, 0.05) 1px, transparent 1px) 0 0 / 3px 3px;
        }

        /* 新增1：羊皮纸怀旧棕（仿旧棕） */
        [data-theme="parchment"] {
            --bg: #e8d9b8;
            --text: #3a2c17;
            --text-secondary: #7e6642;
            --accent: #8c5a20;
            --accent-light: #b07a35;
            --toolbar-bg: rgba(232, 217, 184, 0.93);
            --panel-bg: #f3e6c9;
            --border: #cfb88c;
            --shadow: rgba(80, 60, 30, 0.14);
            --progress-bar: #8c5a20;
            --paper-texture:
                /* 羊皮纸纤维感：两层不同大小的点 */
                radial-gradient(rgba(110, 70, 20, 0.06) 1px, transparent 1px) 0 0 / 2px 2px,
                radial-gradient(rgba(140, 90, 32, 0.04) 1.4px, transparent 1.4px) 1px 0 / 4px 4px;
        }

        /* 新增2：护眼淡粉（樱花） */
        [data-theme="pink"] {
            --bg: #f6e9eb;
            --text: #3d2a2e;
            --text-secondary: #876970;
            --accent: #c3546c;
            --accent-light: #e07c90;
            --toolbar-bg: rgba(246, 233, 235, 0.93);
            --panel-bg: #fdf2f4;
            --border: #e0c6cb;
            --shadow: rgba(120, 60, 70, 0.1);
            --progress-bar: #c3546c;
            --paper-texture:
                radial-gradient(rgba(180, 80, 100, 0.045) 1px, transparent 1px) 0 0 / 3px 3px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg);
            background-image: var(--paper-texture);
            color: var(--text);
            transition: background-color var(--transition-speed), color var(--transition-speed),
                        background-image var(--transition-speed);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        /* 夜间模式额外暗角渐变（让中心更亮、四角更暗，像阅读灯） */
        [data-theme="night"] body,
        html[data-theme="night"] body {
            background-image:
                radial-gradient(ellipse at 50% 50%, rgba(30, 35, 50, 0) 50%, rgba(10, 12, 20, 0.45) 100%),
                var(--paper-texture);
        }

        /* ========== 上传页面 ========== */
        #upload-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 10;
            transition: opacity 0.5s, transform 0.5s;
        }
        #upload-page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        .upload-container {
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 40px 30px;
        }
        .upload-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
            color: var(--accent);
            text-shadow: 2px 2px 4px var(--shadow);
        }
        .upload-logo svg { flex: 0 0 auto; }
        .upload-logo-text {
            font-size: 40px;
            font-weight: bold;
            letter-spacing: 8px;
        }
        .upload-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text);
            letter-spacing: 4px;
        }
        .upload-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 36px;
            letter-spacing: 2px;
        }
        .upload-dropzone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 50px 30px;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--panel-bg);
            position: relative;
        }
        .upload-dropzone:hover,
        .upload-dropzone.dragover {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--panel-bg) 80%, var(--accent) 20%);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--shadow);
        }
        .upload-dropzone .icon {
            font-size: 52px;
            margin-bottom: 16px;
        }
        .upload-dropzone .text {
            font-size: 16px;
            color: var(--text);
            font-weight: 500;
        }
        .upload-dropzone .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        .upload-dropzone input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .upload-footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .folder-picker {
            margin-top: 14px;
        }
        .folder-picker button {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            background: var(--panel-bg);
            color: var(--text-secondary);
            cursor: pointer;
        }
        .folder-picker button:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .import-progress {
            width: 220px;
            height: 6px;
            accent-color: var(--accent);
        }
        #cancel-loading {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* ========== 阅读器页面（无页眉页脚版） ========== */
        #reader-page {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #reader-page.active {
            opacity: 1;
            pointer-events: auto;
        }

        .toolbar-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 22px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            min-width: 40px;
            min-height: 40px;
        }
        .toolbar-btn:hover {
            background: color-mix(in srgb, var(--panel-bg) 70%, var(--text) 10%);
        }
        .toolbar-btn:active {
            transform: scale(0.92);
        }
        .toolbar-title {
            flex: 1;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text);
        }
        .toolbar-title .book-name {
            font-weight: 600;
        }
        .toolbar-title .chapter-name {
            font-size: 12px;
            color: var(--text-secondary);
            display: block;
            margin-top: 1px;
        }

        /* 内容区域 */
        #content-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px 20px 40px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            cursor: pointer;
            position: relative;
        }
        #content-area::-webkit-scrollbar {
            width: 4px;
        }
        #content-area::-webkit-scrollbar-track {
            background: transparent;
        }
        #content-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        #chapter-content {
            max-width: 680px;
            margin: 0 auto;
            font-size: var(--font-size);
            line-height: var(--line-height);
            font-family: var(--font-family);
            color: var(--text);
            word-wrap: break-word;
            word-break: break-word;
            transition: font-size 0.25s, line-height 0.25s, color 0.3s;
        }
        #chapter-content h1,
        #chapter-content h2,
        #chapter-content h3,
        #chapter-content h4 {
            margin: 1.2em 0 0.6em;
            font-weight: 600;
            line-height: 1.4;
        }
        #chapter-content h1 {
            font-size: 1.5em;
            text-align: center;
            margin-top: 0.3em;
        }
        #chapter-content h2 {
            font-size: 1.3em;
        }
        #chapter-content h3 {
            font-size: 1.15em;
        }
        #chapter-content p {
            margin: 0 0 0.8em;
            text-indent: 2em;
            letter-spacing: 0.3px;
        }
        #chapter-content p.no-indent {
            text-indent: 0;
        }
        /* ===== TXT L2 长页式排版：样式化分隔符 + 章末注脚 ===== */
        #chapter-content .txt-sep {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 1.6em auto;
            color: var(--text-secondary);
        }
        #chapter-content .txt-sep::before,
        #chapter-content .txt-sep::after {
            content: "";
            width: 36px;
            height: 1px;
            background: currentColor;
            opacity: 0.45;
        }
        #chapter-content .txt-sep i {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.45;
        }
        #chapter-content .chapter-end {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85em;
            letter-spacing: 0.35em;
            text-indent: 0;
            margin: 3em 0 1.5em;
            opacity: 0.8;
        }
        #chapter-content img {
            max-width: 100%;
            max-height: 65vh;          /* 防止大图/封面占满整屏，给文字留出空间 */
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            margin: 14px auto;
            display: block;
            box-shadow: 0 2px 12px color-mix(in srgb, var(--shadow) 60%, transparent);
        }
        /* 防止无缝模式下 chapter-inner/block 内的横向溢出（宽图） */
        .chapter-block,
        .chapter-inner {
            max-width: 100%;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        #chapter-content blockquote {
            margin: 1em 0;
            padding: 0.6em 1em;
            border-left: 3px solid var(--accent);
            background: color-mix(in srgb, var(--panel-bg) 60%, transparent);
            font-style: italic;
        }
        #chapter-content a {
            color: var(--accent);
            text-decoration: none;
        }
        #chapter-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5em auto;
            width: 40%;
        }
        #chapter-content pre {
            background: color-mix(in srgb, var(--panel-bg) 70%, transparent);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9em;
            margin: 1em 0;
        }
        #chapter-content code {
            font-family: 'Courier New', monospace;
            background: color-mix(in srgb, var(--panel-bg) 70%, transparent);
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        /* ========== 目录侧边栏 ========== */
        #toc-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
        }
        #toc-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #toc-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 300px;
            max-width: 80vw;
            background: var(--panel-bg);
            z-index: 70;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 20px var(--shadow);
        }
        #toc-sidebar.active {
            transform: translateX(0);
        }
        .toc-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .toc-header h3 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text);
        }
        .toc-close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .toc-close-btn:hover {
            background: color-mix(in srgb, var(--panel-bg) 70%, var(--text) 10%);
        }
        .toc-book-info {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .toc-book-info .toc-book-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        .toc-book-info .toc-book-author {
            /* 目录作者名不显示（隐藏占位，保持 DOM 引用兼容） */
            display: none;
        }
        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
            -webkit-overflow-scrolling: touch;
        }
        .toc-list::-webkit-scrollbar {
            width: 3px;
        }
        .toc-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .toc-item {
            padding: 11px 20px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text);
            transition: background 0.2s, color 0.2s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        .toc-item:hover {
            background: color-mix(in srgb, var(--panel-bg) 70%, var(--accent) 10%);
        }
        .toc-item.active {
            border-left-color: var(--accent);
            background: color-mix(in srgb, var(--panel-bg) 70%, var(--accent) 12%);
            font-weight: 600;
            color: var(--accent);
        }
        .toc-item .toc-index {
            font-size: 11px;
            color: var(--text-secondary);
            min-width: 28px;
            text-align: right;
            flex-shrink: 0;
            font-weight: 400;
        }
        .toc-item.active .toc-index {
            color: var(--accent);
        }
        .toc-item .toc-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ========== 设置面板 ========== */
        #settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
        }
        #settings-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #settings-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--panel-bg);
            z-index: 70;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 30px var(--shadow);
            padding: 18px 22px max(24px, env(safe-area-inset-bottom));
            max-height: 70vh;
            overflow-y: auto;
        }
        #settings-panel.active {
            transform: translateY(0);
        }
        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .settings-header h3 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text);
        }
        .settings-close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .settings-section {
            margin-bottom: 18px;
        }
        .settings-section label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-weight: 500;
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .font-size-control {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg);
            border-radius: 10px;
            padding: 6px 14px;
            border: 1px solid var(--border);
        }
        .font-size-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            transition: background 0.2s, transform 0.15s;
            font-weight: 600;
        }
        .font-size-btn:hover {
            background: color-mix(in srgb, var(--panel-bg) 70%, var(--text) 10%);
        }
        .font-size-btn:active {
            transform: scale(0.9);
        }
        .font-size-display {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            min-width: 36px;
            text-align: center;
        }
        .theme-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .theme-option {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #333;
            font-weight: 500;
            letter-spacing: 0;
        }
        .theme-option:hover {
            transform: scale(1.08);
        }
        .theme-option.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
        }
        .theme-option.theme-warm {
            background: #f5e6c8;
            color: #3b2a1a;
        }
        .theme-option.theme-white {
            background: #ffffff;
            color: #2c2c2c;
            border-color: #ddd;
        }
        .theme-option.theme-parchment {
            background: #e8d9b8;
            color: #3a2c17;
            border-color: #c9b284;
        }
        .theme-option.theme-pink {
            background: #f6e9eb;
            color: #c3546c;
            border-color: #e0c6cb;
        }
        .theme-option.theme-night {
            background: #1a1a1a;
            color: #b8b8b8;
        }
        .theme-option.theme-green {
            background: #c8e6c8;
            color: #2a3b2a;
        }
        .theme-option.theme-custom {
            background: var(--bg);
            color: var(--text);
            border-color: var(--border);
        }
        /* 自定义主题：所有配色变量由 applySettingsToContent 根据 customBg 动态写入 :root */
        [data-theme="custom"] {
            /* 占位，实际值由 JS 设置；若 JS 未注入则回退到暖黄默认 */
        }
        .font-family-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .font-option {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            transition: all 0.2s;
            letter-spacing: 0.5px;
            font-family: inherit;
        }
        .font-option:hover {
            border-color: var(--accent);
        }
        .font-option.active {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, var(--bg));
            color: var(--accent);
            font-weight: 600;
        }
        .line-height-options {
            display: flex;
            gap: 8px;
        }
        .line-height-option {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            transition: all 0.2s;
            letter-spacing: 0.5px;
            font-family: inherit;
        }
        .line-height-option:hover {
            border-color: var(--accent);
        }
        .line-height-option.active {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, var(--bg));
            color: var(--accent);
            font-weight: 600;
        }

        /* ========== 章节切换动画 ========== */
        .chapter-transition {
            animation: chapterFadeIn 0.45s ease;
        }
        @keyframes chapterFadeIn {
            0% {
                opacity: 0;
                transform: translateY(18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 无缝长阅读章节分隔符 ========== */
        .chapter-divider {
            text-align: center;
            margin: 40px auto 30px;
            padding: 20px 0;
            border-top: 1px dashed var(--border);
            border-bottom: 1px dashed var(--border);
            color: var(--text-secondary);
            font-size: 13px;
            letter-spacing: 4px;
            position: relative;
            max-width: 400px;
        }
        .chapter-divider .divider-title {
            display: inline-block;
            background: var(--bg);
            padding: 0 16px;
            position: relative;
            font-weight: 500;
            top: -1px;
        }
        .chapter-block {
            scroll-margin-top: 20px;
        }
        .chapter-block .chapter-heading {
            font-size: 1.4em;
            font-weight: 600;
            text-align: center;
            margin: 0.4em 0 1em;
            line-height: 1.4;
            color: var(--text);
        }

        /* ========== 点击区域闪烁反馈（长页式） ========== */
        .tap-feedback {
            position: fixed;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: color-mix(in srgb, var(--text) 12%, transparent);
            pointer-events: none;
            z-index: 80;
            animation: tapFade 0.45s ease forwards;
            transform: translate(-50%, -50%);
        }
        @keyframes tapFade {
            0%   { opacity: 0.8; transform: translate(-50%, -50%) scale(0.6); }
            100% { opacity: 0;   transform: translate(-50%, -50%) scale(1.4); }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            #content-area {
                padding: 18px 14px 30px;
            }
            #chapter-content {
                font-size: calc(var(--font-size) - 1px);
            }
            .toolbar-title {
                font-size: 13px;
            }
            .toolbar-title .chapter-name {
                font-size: 11px;
            }
            #toc-sidebar {
                width: 260px;
                max-width: 85vw;
            }
            .upload-logo {
                gap: 10px;
            }
            .upload-logo svg {
                width: 42px;
                height: 42px;
            }
            .upload-logo-text {
                font-size: 30px;
                letter-spacing: 6px;
            }
            .upload-title {
                font-size: 22px;
            }
        }
        @media (min-width: 768px) {
            #content-area {
                padding: 32px 40px 50px;
            }
            #chapter-content {
                max-width: 720px;
            }
        }
        @media (min-width: 1024px) {
            #chapter-content {
                max-width: 760px;
            }
            #content-area {
                padding: 40px 60px 60px;
            }
        }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loading-indicator {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            background: var(--panel-bg);
            padding: 20px 30px;
            border-radius: 14px;
            box-shadow: 0 8px 30px var(--shadow);
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text);
            letter-spacing: 1px;
        }
        #loading-indicator.active {
            display: flex;
        }

        /* 章节间过渡遮罩 */
        #chapter-loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }
        #chapter-loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ============================================================
           长页式 · 右侧悬浮侧边栏（竖排图标按钮）
           ============================================================ */
        .sidebar-dock {
            position: fixed;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 12px 8px;
            background: var(--toolbar-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 6px 24px var(--shadow);
            transition: opacity .32s ease, transform .32s ease, right .32s ease;
            will-change: transform, opacity;
        }
        /* 点击中区/空闲时，侧边栏可整体隐藏（沉浸式） */
        body.dock-hidden .sidebar-dock {
            opacity: 0;
            transform: translateY(-50%) translateX(16px);
            pointer-events: none;
        }

        .dock-item {
            width: 50px;
            height: 54px;
            background: none;
            border: none;
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 4px 2px;
            transition: background .2s, transform .15s, color .2s;
            font-family: inherit;
            user-select: none;
        }
        .dock-item .dock-icon {
            font-size: 22px;
            line-height: 1;
            pointer-events: none;
            filter: drop-shadow(0 1px 0 color-mix(in srgb, var(--panel-bg) 50%, transparent));
        }
        .dock-item .dock-label {
            font-size: 10.5px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            pointer-events: none;
            transition: color .2s;
        }
        .dock-item:hover {
            background: color-mix(in srgb, var(--panel-bg) 70%, var(--accent) 12%);
            color: var(--accent);
        }
        .dock-item:hover .dock-label {
            color: var(--accent);
        }
        .dock-item:active {
            transform: scale(0.92);
        }
        /* 活跃态：夜间模式激活时用 accent 色高亮月亮 */
        .dock-item.is-active {
            background: color-mix(in srgb, var(--accent) 14%, var(--panel-bg));
            color: var(--accent);
        }
        .dock-item.is-active .dock-label {
            color: var(--accent);
            font-weight: 600;
        }
        /* dock 分隔线（可在按钮间插入） */
        .dock-divider {
            width: 60%;
            height: 1px;
            background: color-mix(in srgb, var(--border) 80%, transparent);
            margin: 2px 0;
        }

        /* 夜间模式给 dock 加一个极弱的发光（经典阅读器风） */
        [data-theme="night"] .sidebar-dock {
            box-shadow: 0 6px 26px rgba(0, 0, 0, 0.55),
                        0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent);
        }

        /* 小屏（手机）下：把侧边栏 dock 缩小半透明贴边 */
        @media (max-width: 640px) {
            .sidebar-dock {
                right: 8px;
                padding: 10px 6px;
                gap: 8px;
                border-radius: 12px;
            }
            .dock-item {
                width: 44px;
                height: 48px;
            }
            .dock-item .dock-icon { font-size: 20px; }
            .dock-item .dock-label { font-size: 9.5px; }
        }

    </style>
</head>

            // JSZip 仅在导入 EPUB 时加载：在线优先使用带 SRI 的固定 CDN，
            // 离线、超时或完整性校验失败时回退到随项目发布的本地副本。
            const JSZIP_SOURCES = {
                cdn: {
                    src: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
                    integrity: 'sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=='
                },
                local: { src: './vendor/jszip-3.10.1.min.js' }
            };
            let jsZipLoadPromise = null;

            function loadScript(source, timeoutMs = 3500) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    let settled = false;
                    const finish = (callback, value) => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        script.onload = null;
                        script.onerror = null;
                        callback(value);
                    };
                    const timer = setTimeout(() => {
                        script.remove();
                        finish(reject, new Error(`加载超时：${source.src}`));
                    }, timeoutMs);

                    script.src = source.src;
                    script.async = true;
                    script.referrerPolicy = 'no-referrer';
                    if (source.integrity) {
                        script.integrity = source.integrity;
                        script.crossOrigin = 'anonymous';
                    }
                    script.onload = () => {
                        if (window.JSZip && typeof window.JSZip.loadAsync === 'function') {
                            finish(resolve, window.JSZip);
                        } else {
                            script.remove();
                            finish(reject, new Error(`库初始化失败：${source.src}`));
                        }
                    };
                    script.onerror = () => {
                        script.remove();
                        finish(reject, new Error(`加载失败：${source.src}`));
                    };
                    document.head.appendChild(script);
                });
            }

            async function ensureJSZip() {
                if (window.JSZip && typeof window.JSZip.loadAsync === 'function') return window.JSZip;
                if (jsZipLoadPromise) return jsZipLoadPromise;

                jsZipLoadPromise = (async () => {
                    // navigator.onLine 只能提示离线状态，不能证明网络可用；在线分支仍有超时回退。
                    const candidates = navigator.onLine === false
                        ? [JSZIP_SOURCES.local]
                        : [JSZIP_SOURCES.cdn, JSZIP_SOURCES.local];
                    const failures = [];
                    for (const source of candidates) {
                        try {
                            return await loadScript(source);
                        } catch (error) {
                            failures.push(error.message);
                            console.warn('[JSZip]', error.message);
                        }
                    }
                    throw new Error(`JSZip 加载失败（${failures.join('；')}）`);
                })();

                try {
                    return await jsZipLoadPromise;
                } catch (error) {
                    jsZipLoadPromise = null; // 网络恢复或本地文件修复后允许重试。
                    throw error;
                }
            }

            function debounce(fn, delay) {

                return function(...args) {

            // 长页式：点击水波纹反馈

            function getPathDir(path) {
                const idx = path.lastIndexOf('/');
                return idx >= 0 ? path.substring(0, idx + 1) : '';
            }

            function resolveRelative(basePath, relPath) {
                // 处理相对路径
                if (relPath.startsWith('/')) return relPath.substring(1);
                const baseDir = getPathDir(basePath);
                const combined = baseDir + relPath;
                // 处理 ../
                const parts = combined.split('/');
                const result = [];
                for (const part of parts) {
                    if (part === '..') {
                        result.pop();
                    } else if (part === '.' || part === '') {
                        // skip
                    } else {
                        result.push(part);
                    }
                }
                return result.join('/');
            }

            // 生成 Blob URL，同时记录章节索引（用于滚动窗口式内存回收）
            function generateBlobUrl(data, mimeType, chapterIdx = -1) {
                const blob = new Blob([data], { type: mimeType || 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                state.blobUrls.push({ url, chapterIdx });
                return url;
            }

            function cleanupBlobUrls() {
                state.blobUrls.forEach(entry => {
                    try { URL.revokeObjectURL(entry.url); } catch (e) {}
                });
                state.blobUrls = [];
            }

            // Blob 滚动窗口回收：仅保留 [lo, hi] 范围内章节的图片 Blob，超出的 revoke 释放内存
            function cleanupBlobWindow(lo, hi) {
                if (!Array.isArray(state.blobUrls) || state.blobUrls.length === 0) return;
                const keep = [];
                const droppedChapters = new Set();
                for (const entry of state.blobUrls) {
                    const ci = entry.chapterIdx;
                    const outOfWindow = ci >= 0 && (ci < lo || ci > hi);
                    if (outOfWindow) {
                        try { URL.revokeObjectURL(entry.url); } catch (e) {}
                        droppedChapters.add(ci);
                    } else {
                        keep.push(entry);
                    }
                }
                state.blobUrls = keep;
                // 被回收章节的 HTML 缓存中含已失效的 blob: URL，丢弃缓存；
                // 下次渲染到该章时从 zip 重新解压处理（TXT 无 blob 条目，不受影响）
                droppedChapters.forEach(ci => {
                    if (state.chapters[ci] != null) state.chapters[ci] = null;
                });
            }

            /**
             * 从Zip中读取文件，兼容路径URL编码（如%20）的情况。
             * @param {JSZip} zip - JSZip实例
             * @param {string} path - 原始路径（可能包含URL编码）
             * @param {'string'|'arraybuffer'} type - 返回类型
             * @returns {Promise<string|ArrayBuffer|null>}
             */
            async function getZipFileContent(zip, path, type = 'string') {
                const tryRead = async (actualPath) => {
                    const file = zip.file(actualPath);
                    if (file) {
                        return type === 'arraybuffer' ? await file.async('arraybuffer') : await file.async('string');
                    }
                    return null;
                };

                // 1. 直接尝试原始路径
                let result = await tryRead(path);
                if (result !== null) return result;

                // 2. 尝试 decodeURIComponent 解码
                try {
                    const decoded = decodeURIComponent(path);
                    if (decoded !== path) {
                        result = await tryRead(decoded);
                        if (result !== null) return result;
                    }
                } catch (e) {
                    // 解码失败，继续尝试其他方式
                }

                // 3. 尝试将 %20 等替换为空格（通用处理）
                const spacePath = path.replace(/%20/gi, ' ');
                if (spacePath !== path) {
                    result = await tryRead(spacePath);
                    if (result !== null) return result;
                }

                return null;
            }

            function extractTitleFromHtml(htmlContent) {
                // 从HTML中提取标题
                const doc = new DOMParser().parseFromString(htmlContent, 'text/html');
                const h1 = doc.querySelector('h1');
                if (h1 && h1.textContent.trim()) return h1.textContent.trim();
                const h2 = doc.querySelector('h2');
                if (h2 && h2.textContent.trim()) return h2.textContent.trim();
                const h3 = doc.querySelector('h3');
                if (h3 && h3.textContent.trim()) return h3.textContent.trim();
                const title = doc.querySelector('title');
                if (title && title.textContent.trim()) return title.textContent.trim();
                return null;
            }

            // ==================== TXT解析（新增：与EPUB并列，产出相同的 state.chapters/chapterTitles 结构） ====================
            // 广告/干扰行模板（逐行整行匹配才剔除；纯分隔线不放这里——L2 会转成样式化分隔符）
            const TXT_AD_PATTERNS = [
                /最新章节|最快更新|首发于|本书来自|转载来自|盗版必究/,
                /(本作品由.{1,24}(提供|首发|制作))|[\w\u4e00-\u9fa5]{2,10}中文网/,
                /^(求收藏|求推荐|求月票|求订阅|求鲜花|求打赏|求支持)[！!。，,.\s]*$/,
                /^[（(]?(未完待续|本章完|本章结束|待续)[）)]?[。.！!]*$/,
                /^本章字数[:：]/,                                          // 网文平台导出残留
                /^[-—=]{2,}[^-—=]{2,16}[-—=]{2,}$/,                        // ------章节内容开始------- 类装饰行（中间必须含非横线文字，纯分隔线保留给L2转sep）
                /www\.[\w-]+\.(com|net|org|cc|info|la)|https?:\/\/\S+/i,
            ];

            function normalizeDigits(s) {
                return String(s).replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0));
            }

            // 中文数字（含大写）→ 阿拉伯数字，用于章节序号单调性校验
            function cnNumToInt(cnRaw) {
                const cn = normalizeDigits(String(cnRaw)).trim();
                if (/^\d{1,7}$/.test(cn)) return parseInt(cn, 10);
                const DIGIT = { '零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,
                    '壹':1,'贰':2,'貳':2,'叁':3,'參':3,'肆':4,'伍':5,'陆':6,'陸':6,'柒':7,'捌':8,'玖':9 };
                const UNIT = { '十':10,'拾':10,'百':100,'佰':100,'千':1000,'仟':1000 };
                let total = 0, section = 0, num = 0;
                for (const ch of cn) {
                    if (ch in DIGIT) { num = DIGIT[ch]; }
                    else if (ch in UNIT) { section += (num || 1) * UNIT[ch]; num = 0; }
                    else if (ch === '万' || ch === '萬') { total = (total + section + num) * 10000; section = 0; num = 0; }
                    else if (ch === '亿' || ch === '億') { total = (total + section + num) * 100000000; section = 0; num = 0; }
                }
                return total + section + num;
            }

            // 编码探测：BOM → UTF-8 严格解码 → GB18030 兜底（浏览器 TextDecoder 原生支持，零依赖）
            function detectAndDecodeText(buffer) {
                const bytes = new Uint8Array(buffer);
                if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF)
                    return { text: new TextDecoder('utf-8').decode(bytes.subarray(3)), enc: 'UTF-8(BOM)' };
                if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE)
                    return { text: new TextDecoder('utf-16le').decode(bytes.subarray(2)), enc: 'UTF-16LE' };
                if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF)
                    return { text: new TextDecoder('utf-16be').decode(bytes.subarray(2)), enc: 'UTF-16BE' };
                try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes), enc: 'UTF-8' }; } catch (e) {}
                try { return { text: new TextDecoder('gb18030').decode(bytes), enc: 'GB18030/GBK' }; } catch (e) {}
                return { text: new TextDecoder().decode(bytes), enc: '默认' };
            }

            // 清洗：去控制字符、统一换行、逐行剔除广告。
            // L2：仅去行尾空白与半角前导空白，保留全角空格 \u3000 前缀作为"段首缩进"标记（供 modeB 分段）
            function txtCleanRaw(text) {
                text = text.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\u2028\u2029\uFEFF]/g, '');
                text = text.replace(/\r\n?/g, '\n');
                const out = [];
                for (const raw of text.split('\n')) {
                    const line = raw.replace(/^[\t ]+/, '').replace(/\s+$/, '');
                    if (!line) { out.push(''); continue; }
                    if (TXT_AD_PATTERNS.some(re => re.test(line))) continue;
                    out.push(line);
                }
                return out;
            }

            // 章节标题识别（行首匹配 + 序号单调递增校验 + 行长/句末标点约束）
            // L2：允许行首全角/半角空格；可选前缀：允许"上卷 第一回…"这类 卷部集 前缀的章回体标题
            const RE_ORDINAL_HEAD = /^[　\s]*(?:[^\n第]{0,8}?[卷部集][\s　]*)?第\s*(\d{1,7}|[零〇一二两三四五六七八九十百千万壹贰叁肆伍陆柒捌玖拾佰仟]{1,15})\s*[章节卷回部篇集]/;
            const RE_CHAPTER_EN = /^[　\s]*Chapter\s+(\d{1,5})\b.{0,45}$/i;
            const RE_KEYWORD_HEAD = /^[　\s]*(楔子|引子|序章|序言|序幕|自序|前言|后记|尾声|终章|终曲|大结局|番外|外传|间章|结语|结束语|序)(?=[\s：:·.\-—]|$).{0,25}$/;

            function matchHeading(line, lastOrdinal, lastVolOrdinal) {
                if (line.length > 50) return null;
                if (/[。！？，；…”』」]$/.test(line)) return null; // 句末标点 → 判为正文
                let m = line.match(RE_ORDINAL_HEAD);
                if (m) {
                    const isVol = /[卷]$/.test(m[0].trim());
                    const ord = cnNumToInt(m[1]);
                    const lastRef = isVol ? lastVolOrdinal : lastOrdinal;
                    if (ord > lastRef) return { title: line.replace(/^[　\s]+/, ''), ordinal: ord, isVol };
                    return null; // 序号不递增 → 疑似正文引用/目录残留
                }
                m = line.match(RE_CHAPTER_EN);
                if (m) {
                    const ord = parseInt(m[1], 10);
                    if (ord > lastOrdinal) return { title: line.replace(/^[　\s]+/, ''), ordinal: ord, isVol: false };
                    return null;
                }
                if (line.length <= 30 && RE_KEYWORD_HEAD.test(line)) return { title: line.replace(/^[　\s]+/, ''), ordinal: null, isVol: false };
                return null;
            }

            // 合并硬换行：中文直接拼接，ASCII 边界补空格
            function joinSmart(arr) {
                return arr.reduce((acc, l) => {
                    if (!acc) return l;
                    const needSpace = /[A-Za-z0-9,;:)\]}]/.test(acc[acc.length - 1]) && /[A-Za-z0-9(\[{]/.test(l[0]);
                    return acc + (needSpace ? ' ' : '') + l;
                }, '');
            }

            // 章节行数组 → L2长页式排版 HTML
            // 1) 排版模式检测：A=空行分段(网文平台导出主流) / B=全角缩进分段(老式排版) / C=句末标点启发分段(硬换行无标记)
            // 2) 段内硬换行合并（joinSmart，ASCII 边界补空格）
            // 3) 纯分隔线行 → 样式化 .txt-sep；"。。。"→"……"；段首缩进交给 CSS（strip 原 \u3000）
            // 4) 章末追加"— 本章完 —"注脚
            function chapterToHtml(lines) {
                let nonEmpty = 0, blanks = 0, indents = 0;
                for (const l of lines) {
                    if (!l) { blanks++; continue; }
                    nonEmpty++;
                    if (l[0] === '\u3000') indents++;
                }
                const total = nonEmpty + blanks;
                // 高缩进比例（>50%行有全角缩进）时缩进是更强的段界信号，优先 modeB 而非 modeA
                const highIndent = nonEmpty > 4 && indents >= 2 && indents / nonEmpty > 0.5;
                const modeA = total > 4 && blanks / total > 0.12 && !highIndent;           // 空行分段
                const modeB = !modeA && nonEmpty > 4 && indents >= 2 && indents / nonEmpty > 0.25; // 缩进分段

                const paras = [];
                let buf = [], prevLine = '';
                const flushP = () => {
                    if (!buf.length) return;
                    paras.push({ t: 'p', text: joinSmart(buf) });
                    buf = [];
                };
                // C模式：行内按句末标点（含连续叹号/省略号）切分为句段，句界即段界（硬换行无标记文本的启发兜底）
                const toSegs = (!modeA && !modeB)
                    ? (line) => {
                        const segs = [];
                        let rest = line;
                        for (;;) {
                            const m = rest.match(/^(.+?[。！？”…』」]+)(.+)$/);
                            if (!m) { segs.push(rest); break; }
                            segs.push(m[1]);
                            rest = m[2];
                        }
                        // 尾段若为纯标点（如行尾孤立省略号），并回上一段
                        if (segs.length >= 2 && /^[。！？”…』」]+$/.test(segs[segs.length - 1])) {
                            segs[segs.length - 2] += segs.pop();
                        }
                        return segs;
                    }
                    : (line) => [line];
                for (const line of lines) {
                    if (!line) {
                        if (modeA) flushP();                    // A：空行=段界
                        else prevLine = buf.length ? buf[buf.length - 1] : prevLine;
                        continue;
                    }
                    if (/^[-=*_~·—\s]{6,}$/.test(line)) {       // 纯分隔线 → 样式化分隔符
                        flushP();
                        paras.push({ t: 'sep' });
                        prevLine = '';
                        continue;
                    }
                    for (const seg of toSegs(line)) {
                        let boundary = false;
                        if (modeA) {
                            boundary = false;                    // A：段界只由空行产生，段内一律合并
                        } else if (modeB) {
                            boundary = seg[0] === '\u3000';      // B：缩进行=新段起点，无缩进行=硬换行续行
                        } else {
                            boundary = buf.length === 0 || /[。！？”…』」]$/.test(prevLine); // C：句末标点=段界
                        }
                        if (boundary) flushP();
                        buf.push(seg);
                        prevLine = seg;
                    }
                }
                flushP();

                if (!paras.length) return '';
                let html = paras.map(p => p.t === 'sep'
                    ? '<div class="txt-sep"><i></i></div>'
                    : `<p>${escapeHtml(p.text.replace(/^[\u3000\s]+/, '').replace(/。{3,}/g, '……'))}</p>`
                ).join('');
                html += '<div class="chapter-end">— 本章完 —</div>';
                return html;
            }

            // 无章节标记兜底：按字数在段落边界切块
            function splitBySize(lines, targetChars) {
                const out = [];
                let buf = [], count = 0;
                const flush = () => {
                    if (!buf.length) return;
                    out.push({ title: `第${out.length + 1}部分`, ordinal: null, isVol: false, lines: buf });
                    buf = []; count = 0;
                };
                for (const line of lines) {
                    buf.push(line);
                    count += line.length;
                    if (count >= targetChars) flush();
                }
                flush();
                return out;
            }

            // 主分割器：逐行扫描 + 卷/章序号独立单调校验 + 目录页过滤
            function splitTxtChapters(lines) {
                const raw = [];
                let cur = null, curHasText = false, lastOrdinal = 0, lastVolOrdinal = 0;
                const pushCur = () => { if (cur && (curHasText || cur.fromHead)) raw.push(cur); };
                for (const line of lines) {
                    if (!line) { if (cur && curHasText) cur.lines.push(''); continue; }
                    const head = matchHeading(line, lastOrdinal, lastVolOrdinal);
                    if (head) {
                        pushCur();
                        cur = { title: head.title, ordinal: head.ordinal, isVol: head.isVol, fromHead: true, lines: [] };
                        curHasText = false;
                        if (head.isVol) {
                            lastVolOrdinal = head.ordinal;
                            // 新一卷开始：章节序号在卷内重新编号（卷二"第一章" ord=1 必须能通过单调性校验）
                            lastOrdinal = 0;
                        }
                        else if (head.ordinal) lastOrdinal = head.ordinal;
                        continue;
                    }
                    if (!cur) cur = { title: '开篇', ordinal: null, isVol: false, fromHead: false, lines: [] };
                    cur.lines.push(line);
                    curHasText = true;
                }
                pushCur();

                // 目录页过滤：同类型序号连续 + 正文几乎为空（真实目录页每项只有标题行）→ 并入下一章
                for (let i = raw.length - 2; i >= 0; i--) {
                    const c = raw[i], n = raw[i + 1];
                    const bodyLen = c.lines.join('').length;
                    if (c.ordinal != null && n && c.isVol === n.isVol && n.ordinal === c.ordinal + 1 && bodyLen < 3) {
                        n.lines = c.lines.concat(n.lines);
                        raw.splice(i, 1);
                    }
                }
                // 卷标题自身无正文时不生成空章节（卷边界已通过 lastOrdinal 重置生效）
                for (let i = raw.length - 1; i >= 0; i--) {
                    if (raw[i].isVol && raw[i].lines.join('').length < 3) raw.splice(i, 1);
                }

                // 整书无章节标记 → 按字数切块
                if (raw.length === 1 && raw[0].lines.join('').length > 60000) {
                    return splitBySize(raw[0].lines, 25000);
                }
                return raw;
            }

            function naturalFileCompare(a, b) {
                const left = String(a.webkitRelativePath || a.name).split(/(\d+)/).map(v => /^\d+$/.test(v) ? Number(v) : v);
                const right = String(b.webkitRelativePath || b.name).split(/(\d+)/).map(v => /^\d+$/.test(v) ? Number(v) : v);
                const length = Math.max(left.length, right.length);
                for (let i = 0; i < length; i++) {
                    if (left[i] === undefined) return -1;
                    if (right[i] === undefined) return 1;
                    if (left[i] === right[i]) continue;
                    if (typeof left[i] === 'number' && typeof right[i] === 'number') return left[i] - right[i];
                    return String(left[i]).localeCompare(String(right[i]), 'zh-CN');
                }
                return 0;
            }

            function createTxtBookFingerprint(files) {
                let hash = 2166136261;
                const source = files.map(file => [file.webkitRelativePath || file.name, file.size, file.lastModified].join(':')).join('|');
                for (let i = 0; i < source.length; i++) {
                    hash ^= source.charCodeAt(i);
                    hash = Math.imul(hash, 16777619);
                }
                return (hash >>> 0).toString(16);
            }

            async function prepareMultiTxtFiles(fileList, signal) {
                const files = [...fileList].filter(file => /\.txt$/i.test(file.name)).sort(naturalFileCompare);
                if (!files.length) throw new Error('没有找到 TXT 文件');
                if (files.length > state.txtLimits.maxFiles) throw new Error(`TXT 文件数量不能超过 ${state.txtLimits.maxFiles} 个`);
                let totalBytes = 0;
                const seen = new Set();
                const entries = [];
                for (let i = 0; i < files.length; i++) {
                    if (signal?.aborted) throw new DOMException('导入已取消', 'AbortError');
                    const file = files[i];
                    if (file.size > state.txtLimits.maxFileBytes) throw new Error(`文件过大：${file.name}`);
                    const path = file.webkitRelativePath || file.name;
                    const key = [path, file.size, file.lastModified].join(':');
                    if (seen.has(key)) {
                        updateImportProgress(i + 1, files.length);
                        continue;
                    }
                    totalBytes += file.size;
                    if (totalBytes > state.txtLimits.maxTotalBytes) throw new Error('TXT 文件总大小超过限制');
                    seen.add(key);
                    entries.push({ file, fileName: path, title: file.name.replace(/\.txt$/i, '').trim() || '未命名章节' });
                    updateImportProgress(i + 1, files.length);
                    if (i % 100 === 99) await new Promise(resolve => requestAnimationFrame(resolve));
                }
                return entries;
            }

            async function parseTxtFiles(fileList) {
                const loadToken = state.loadToken;
                showLoading(true, '正在整理 TXT 章节...', null, loadToken);
                try {
                    const signal = state._importAbortController?.signal;
                    updateImportProgress(0, fileList.length);
                    const entries = await prepareMultiTxtFiles(fileList, signal);
                    assertCurrentLoad(loadToken);
                    state.txtFiles = entries;
                    state.txtBookFingerprint = createTxtBookFingerprint(entries.map(entry => entry.file));
                    state.txtMode = true;
                    state.txtParts = null;
                    state.txtChapterCache.clear();
                    state.bookInfo.title = entries.length === 1
                        ? entries[0].title
                        : `${entries[0].title} 等 ${entries.length} 个文件`;
                    state.bookInfo.author = '未知作者';
                    state.totalChapters = entries.length;
                    state.currentChapter = 0;
                    state.chapters = new Array(entries.length);
                    state.chapterTitles = entries.map(entry => entry.title);
                    state.scrollPositions = {};
                    state.spine = [];
                    state.zip = null;
                    return true;
                } catch (err) {
                    if (err.name === 'AbortError') return false;
                    console.error('多 TXT 解析失败:', err);
                    alert('多 TXT 导入失败：' + err.message);
                    return false;
                } finally {
                    showLoading(false, null, null, loadToken);
                }
            }

            // TXT主解析：一次解码 + 一次分章，产出与 parseEpub 相同的 state 结构，阅读层零改动复用
            async function parseTxt(file) {
                const loadToken = state.loadToken;
                showLoading(true, '正在解析TXT文件...', null, loadToken);
                try {
                    const buffer = await file.arrayBuffer();
                    assertCurrentLoad(loadToken);
                    const { text, enc } = detectAndDecodeText(buffer);
                    assertCurrentLoad(loadToken);
                    if (!text || !text.trim()) throw new Error('文件内容为空或编码无法识别');

                    const lines = txtCleanRaw(text);
                    const parts = splitTxtChapters(lines);
                    if (!parts.length) throw new Error('未能从文件中解析出内容');

                    state.bookInfo.title = file.name.replace(/\.txt$/i, '').trim() || '未命名书籍';
                    state.bookInfo.author = '未知作者';
                    state.totalChapters = parts.length;
                    state.currentChapter = 0;
                    // 性能：章节 HTML 不在这里一次性全量生成，改为首次访问时由 loadChapterContentOnly 惰性构建
                    state.txtParts = parts;
                    state.chapters = new Array(parts.length);
                    state.chapterTitles = parts.map(p => p.title);
                    state.scrollPositions = {};
                    state.spine = [];
                    state.zip = null;

                    showLoading(false, null, null, loadToken);
                    const wan = (text.length / 10000).toFixed(1);
                    console.log(`TXT解析完成：${state.totalChapters} 章 · 约 ${wan} 万字 · 编码 ${enc}`);
                    return true;
                } catch (err) {
                    showLoading(false, null, null, loadToken);
                    if (err.name === 'AbortError') return false;
                    console.error('TXT解析失败:', err);
                    alert('TXT解析失败：' + err.message);
                    return false;
                }
            }

            // ==================== EPUB解析 ====================
            async function parseEpub(file) {
                const loadToken = state.loadToken;
                showLoading(true, '正在解析EPUB文件...', null, loadToken);
                try {
                    const JSZip = await ensureJSZip();
                    assertCurrentLoad(loadToken);
                    const zip = await JSZip.loadAsync(file);
                    assertCurrentLoad(loadToken);
                    state.zip = zip;

                    // 1. 解析container.xml
                    const containerXml = await zip.file('META-INF/container.xml')?.async('string');
                    assertCurrentLoad(loadToken);
                    if (!containerXml) throw new Error('无效的EPUB文件：缺少container.xml');

                    const containerDoc = new DOMParser().parseFromString(containerXml, 'application/xml');
                    const rootfileEl = containerDoc.querySelector('rootfile');
                    const opfPath = rootfileEl?.getAttribute('full-path') || rootfileEl?.getAttribute('full_path');
                    if (!opfPath) throw new Error('无法找到OPF文件路径');

                    state.opfDir = getPathDir(opfPath);

                    // 2. 解析OPF文件
                    const opfContent = await zip.file(opfPath)?.async('string');
                    assertCurrentLoad(loadToken);
                    if (!opfContent) throw new Error('无法读取OPF文件');

                    const opfDoc = new DOMParser().parseFromString(opfContent, 'application/xml');

                    // 提取元数据
                    const titleEl = opfDoc.querySelector('metadata title') ||
                        opfDoc.querySelector('metadata\\:title') ||
                        opfDoc.getElementsByTagName('dc:title')[0] ||
                        opfDoc.getElementsByTagName('title')[0];
                    const creatorEl = opfDoc.querySelector('metadata creator') ||
                        opfDoc.getElementsByTagName('dc:creator')[0] ||
                        opfDoc.getElementsByTagName('creator')[0];

                    state.bookInfo.title = titleEl?.textContent?.trim() || '未知书名';
                    state.bookInfo.author = creatorEl?.textContent?.trim() || '未知作者';

                    // 提取manifest
                    const manifest = {};
                    const manifestItems = opfDoc.querySelectorAll('manifest item');
                    manifestItems.forEach(item => {
                        const id = item.getAttribute('id');
                        const href = item.getAttribute('href');
                        const mediaType = item.getAttribute('media-type');
                        if (id && href) {
                            manifest[id] = { href, mediaType };
                        }
                    });
                    state.manifest = manifest;

                    // 提取spine顺序
                    const spineItems = opfDoc.querySelectorAll('spine itemref');
                    const spinePaths = [];
                    const spineIds = [];
                    spineItems.forEach(item => {
                        const idref = item.getAttribute('idref');
                        if (idref && manifest[idref]) {
                            const fullPath = resolveRelative(opfPath, manifest[idref].href);
                            const mediaType = manifest[idref].mediaType;
                            // 只包含 HTML/XHTML 内容（注意：不能只匹配 'xml'，
                            // 否则 NCX(application/x-dtbncx+xml)、SVG(image/svg+xml) 等会被误当章节）
                            const mt = (mediaType || '').toLowerCase();
                            if (!mediaType || mt.includes('html') || mt.includes('xhtml')) {
                                spinePaths.push(fullPath);
                                spineIds.push(idref);
                            }
                        }
                    });

                    if (spinePaths.length === 0) throw new Error('EPUB中没有可阅读的章节内容');
                    state.spine = spinePaths;
                    state.totalChapters = spinePaths.length;
                    state.currentChapter = 0;
                    state.chapters = [];
                    state.chapterTitles = [];
                    state.scrollPositions = {};
                    state.txtParts = null;

                    showLoading(false, null, null, loadToken);
                    // 后台批量预提取所有章节标题（不阻塞，目录打开时再 await）
                    ensureAllChapterTitlesLoaded().catch(() => {});
                    return true;
                } catch (err) {
                    showLoading(false, null, null, loadToken);
                    if (err.name === 'AbortError') return false;
                    console.error('EPUB解析失败:', err);
                    alert('EPUB解析失败：' + err.message);
                    return false;
                }
            }

            async function loadChapter(index, options = {}) {
                if (index < 0 || index >= state.totalChapters) return;
                const loadToken = state.loadToken;
                const { preserveScroll = false, scrollToRatio = null } = options;
                showChapterLoading(true, loadToken);
                try {
                    // 预加载目标章节及前后章节（提高切换/无缝衔接速度）
                    const preloadTargets = [index, index - 1, index + 1, index + 2].filter(i => i >= 0 && i < state.totalChapters);
                    await loadChapterSet(preloadTargets, 2, loadToken);
                    assertCurrentLoad(loadToken);

                    state.currentChapter = index;

                    // 渲染（无缝模式：合并多章；普通模式：单章）
                    if (state.seamlessMode) {
                        await renderSeamlessUpTo(Math.min(index + 2, state.totalChapters - 1), loadToken);
                    } else {
                        renderChapter();
                    }
                    assertCurrentLoad(loadToken);

                    // 滚动位置处理
                    if (scrollToRatio !== null) {
                        // 通过进度条拖拽跳转：按比例滚动
                        requestAnimationFrame(() => {
                            const maxScroll = contentArea.scrollHeight - contentArea.clientHeight;
                            if (state.seamlessMode) {
                                // 找到该章节的块元素并计算偏移
                                const blockEl = chapterContent.querySelector(`.chapter-block[data-idx="${index}"]`);
                                if (blockEl) {
                                    const blockTop = blockEl.offsetTop;
                                    const blockHeight = Math.max(1, blockEl.offsetHeight);
                                    contentArea.scrollTop = Math.max(0, blockTop + blockHeight * scrollToRatio - 20);
                                } else {
                                    contentArea.scrollTop = maxScroll * scrollToRatio;
                                }
                            } else {
                                contentArea.scrollTop = Math.max(0, maxScroll * scrollToRatio);
                            }
                        });
                    } else if (preserveScroll) {
                        // 保持（通常是点击目录不滚动变化，或者上下章切换）
                    } else {
                        const savedPos = state.scrollPositions[index];
                        if (savedPos !== undefined && savedPos > 0) {
                            requestAnimationFrame(() => {
                                if (state.seamlessMode) {
                                    const blockEl = chapterContent.querySelector(`.chapter-block[data-idx="${index}"]`);
                                    if (blockEl) {
                                        const blockHeight = Math.max(1, blockEl.offsetHeight);
                                        contentArea.scrollTop = Math.max(0, blockEl.offsetTop + blockHeight * savedPos - 20);
                                    }
                                } else {
                                    const maxScroll = contentArea.scrollHeight - contentArea.clientHeight;
                                    contentArea.scrollTop = savedPos * maxScroll;
                                }
                            });
                        } else {
                            if (state.seamlessMode) {
                                requestAnimationFrame(() => {
                                    const blockEl = chapterContent.querySelector(`.chapter-block[data-idx="${index}"]`);
                                    if (blockEl) {
                                        contentArea.scrollTop = Math.max(0, blockEl.offsetTop - 10);
                                    } else {
                                        contentArea.scrollTop = 0;
                                    }
                                });
                            } else {
                                contentArea.scrollTop = 0;
                            }
                        }
                    }

                    // 更新UI
                    updateUI();

                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.error('加载章节失败:', err);
                    alert('加载章节失败：' + err.message);
                } finally {
                    showChapterLoading(false, loadToken);
                }
            }

            async function loadChapterSet(indices, concurrency, loadToken = state.loadToken) {
                let cursor = 0;
                const worker = async () => {
                    while (cursor < indices.length) {
                        assertCurrentLoad(loadToken);
                        const index = indices[cursor++];
                        if (!state.chapters[index]) await loadChapterContentOnly(index);
                    }
                };
                await Promise.all(Array.from({ length: Math.min(concurrency, indices.length) }, worker));
            }

            async function loadMultiTxtChapter(index) {
                const cached = state.txtChapterCache.get(index);
                if (cached) {
                    cached.lastUsed = Date.now();
                    state.chapters[index] = cached.html;
                    return;
                }
                if (state._txtChapterLoading.has(index)) return state._txtChapterLoading.get(index);
                const loadToken = state.loadToken;
                const task = (async () => {
                    const entry = state.txtFiles[index];
                    const buffer = await entry.file.arrayBuffer();
                    if (loadToken !== state.loadToken) return;
                    const { text } = detectAndDecodeText(buffer);
                    if (loadToken !== state.loadToken) return;
                    state.chapters[index] = text && text.trim()
                        ? chapterToHtml(txtCleanRaw(text))
                        : '<p>（本章内容为空）</p>';
                    state.txtChapterCache.set(index, { html: state.chapters[index], lastUsed: Date.now() });
                    while (state.txtChapterCache.size > state.txtLimits.maxCachedChapters) {
                        let oldestIndex = null;
                        let oldestTime = Infinity;
                        for (const [cachedIndex, cachedEntry] of state.txtChapterCache) {
                            if (cachedIndex === state.currentChapter) continue;
                            if (cachedEntry.lastUsed < oldestTime) {
                                oldestTime = cachedEntry.lastUsed;
                                oldestIndex = cachedIndex;
                            }
                        }
                        if (oldestIndex === null) break;
                        state.txtChapterCache.delete(oldestIndex);
                        if (oldestIndex !== index) state.chapters[oldestIndex] = null;
                    }
                })();
                state._txtChapterLoading.set(index, task);
                try {
                    await task;
                } finally {
                    if (state._txtChapterLoading.get(index) === task) state._txtChapterLoading.delete(index);
                }
            }

            // 仅加载单章内容到缓存（不渲染）
            async function loadChapterContentOnly(index) {
                if (state.chapters[index]) return;
                if (state.txtFiles && state.txtFiles[index]) {
                    return loadMultiTxtChapter(index);
                }
                // TXT模式：章节 HTML 按需从分章结果惰性构建（避免大书一次性同步生成全部章节）
                if (state.txtParts && state.txtParts.length) {
                    const part = state.txtParts[index];
                    state.chapters[index] = part ? chapterToHtml(part.lines) : '';
                    return;
                }
                // 无 zip/spine 的兜底
                if (!state.zip || !state.spine || !state.spine.length) {
                    state.chapters[index] = state.chapters[index] || '';
                    return;
                }
                // 并发去重：同一章正在加载时复用同一个 Promise，避免重复解压/重复生成 Blob
                if (!state._chapterLoading) state._chapterLoading = {};
                if (state._chapterLoading[index]) return state._chapterLoading[index];
                const task = (async () => {
                    const chapterPath = state.spine[index];
                    const zip = state.zip;
                    const htmlContent = await getZipFileContent(zip, chapterPath);
                    if (!htmlContent) {
                        state.chapters[index] = '';
                        return;
                    }
                    // 轻量标题预提取（在 processImages 之前，避免因图片多延迟更新章名）
                    if (!state.chapterTitles[index]) {
                        const quick = extractTitleFromHtml(htmlContent);
                        if (quick) state.chapterTitles[index] = quick;
                    }
                    const doc = new DOMParser().parseFromString(htmlContent, 'text/html');
                    let bodyContent = '';
                    const body = doc.querySelector('body');
                    if (body) bodyContent = body.innerHTML;
                    else bodyContent = htmlContent;
                    // 安全：脚本/事件属性/危险标签统一在 processImages -> sanitizeDoc 白名单消毒
                    bodyContent = await processImages(bodyContent, chapterPath, zip, index);

                    let title = extractTitleFromHtml(bodyContent) || `第${index + 1}章`;
                    if (!state.chapterTitles[index]) state.chapterTitles[index] = title;

                    state.chapters[index] = bodyContent;
                })();
                state._chapterLoading[index] = task;
                try {
                    await task;
                } finally {
                    if (state._chapterLoading[index] === task) delete state._chapterLoading[index];
                }
            }

            // 轻量：只确保标题存在，不解压图片、不处理 body（目录加载前批量预提取）
            async function ensureChapterTitle(index) {
                if (state.chapterTitles[index]) return;
                if (state.chapters[index]) {
                    state.chapterTitles[index] = extractTitleFromHtml(state.chapters[index]) || `第${index + 1}章`;
                    return;
                }
                const chapterPath = state.spine[index];
                const zip = state.zip;
                if (!chapterPath || !zip) {
                    state.chapterTitles[index] = `第${index + 1}章`;
                    return;
                }
                try {
                    const htmlContent = await getZipFileContent(zip, chapterPath);
                    const t = htmlContent ? extractTitleFromHtml(htmlContent) : null;
                    state.chapterTitles[index] = t && t.trim() ? t.trim() : `第${index + 1}章`;
                } catch (e) {
                    state.chapterTitles[index] = `第${index + 1}章`;
                }
            }
            async function ensureAllChapterTitlesLoaded(opts = {}) {
                const total = state.totalChapters;
                if (!total) return;
                const { returnEarlyRatio = null } = opts; // 允许调用者在已得到 X% 标题时就提前 resolve（但后台会继续跑完）
                let cursor = 0;
                let processed = 0;
                let earlyResolved = false;
                let earlyResolveFn = null;
                const earlyPromise = new Promise(res => { earlyResolveFn = res; });
                const concurrency = 4; // 固定并发 4，避免大书主线程被 DOMParser 打爆
                const worker = async () => {
                    while (cursor < total) {
                        const cur = cursor++;
                        try { await ensureChapterTitle(cur); } catch (e) {}
                        processed++;
                        // 每处理 3 章让出 1 帧，保证 UI 不卡死（点 Tab/目录仍有响应）
                        if (processed % 3 === 0) await new Promise(r => setTimeout(r, 0));
                        // 若调用者要求"达到 80% 标题就先 return"，直接 resolve 前台，后台继续跑完
                        if (returnEarlyRatio && !earlyResolved && processed / total >= returnEarlyRatio) {
                            earlyResolved = true;
                            try { earlyResolveFn && earlyResolveFn(); } catch (e) {}
                        }
                    }
                };
                const running = Promise.all(Array.from({ length: concurrency }, () => worker()));
                if (returnEarlyRatio) {
                    // 并行：early 触发 OR 全量跑完，取先到者
                    await Promise.race([earlyPromise, running]);
                    // 但仍把全量 running 挂到后台（丢个 catch 防止后台抛错未处理）
                    running.catch(() => {}).then(() => { state._titlesFullLoaded = true; });
                } else {
                    await running;
                    state._titlesFullLoaded = true;
                }
            }

            // 无缝模式：以当前章为中心维护一个滚动渲染窗口（当前章前 8 章 + 窗口内共 30 章）。
            // 窗口外的章节块从 DOM 回收、Blob URL 释放、HTML 缓存丢弃；回跳到已回收章节时
            // 按序锚点插入重建（支持向前/向后任意跳转），渲染调用经 Promise 链串行化防重复追加。
            const RENDER_WINDOW = 30;   // DOM 中同时保留的最大章节块数
            const RENDER_BEHIND = 8;    // 当前章之前保留的章数

            function buildChapterBlock(i) {
                const content = state.chapters[i] || '';
